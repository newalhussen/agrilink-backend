otp.sms=የአግሪሊንክ ኮድ: {0}። ለ{1} ደቂቃ ያገለግላል። ለማንም አያካፍሉ።

notif.ORDER_CREATED.title=አዲስ ትዕዛዝ {0}
notif.ORDER_CREATED.body={1} {2} አዟል። ጠቅላላ ብር {3}። እባክዎ በ{4} ውስጥ ይመልሱ።
notif.ORDER_ACCEPTED.title=ትዕዛዝ {0} ተቀባይነት አግኝቷል
notif.ORDER_ACCEPTED.body=አርሶ አደሩ ትዕዛዝዎን ተቀብሏል። ለማረጋገጥ አሁን ይክፈሉ። ገንዘብዎ እስከ ርክክብ ድረስ ይጠበቃል።
notif.ORDER_REJECTED.title=ትዕዛዝ {0} አልተቀበለም
notif.ORDER_REJECTED.body=አርሶ አደሩ ይህን ትዕዛዝ ማቅረብ አልቻለም። ምክንያት: {1}
notif.ORDER_CANCELLED.title=ትዕዛዝ {0} ተሰርዟል
notif.ORDER_CANCELLED.body=ይህ ትዕዛዝ ተሰርዟል። ምክንያት: {1}
notif.ORDER_EXPIRED.title=ትዕዛዝ {0} ጊዜው አልፏል
notif.ORDER_EXPIRED.body=ትዕዛዙ ጊዜው ስላለፈ ተዘግቷል። ምንም ገንዘብ አልተወሰደም።
notif.PAYMENT_HELD.title=ለ{0} ክፍያ ደርሷል
notif.PAYMENT_HELD.body=ብር {1} በአግሪሊንክ ተጠብቋል፤ ከርክክብ በኋላ ይከፈላል።
notif.PAYMENT_FAILED.title=የ{0} ክፍያ አልተሳካም
notif.PAYMENT_FAILED.body=ከሂሳብዎ ምንም ገንዘብ አልወጣም። ትዕዛዝዎ እስከ {1} ይቆያል። እባክዎ እንደገና ይሞክሩ።
notif.PAYMENT_REFUNDED.title=ለ{0} ገንዘብ ተመላሽ
notif.PAYMENT_REFUNDED.body=ብር {1} ተመላሽ እየተደረገልዎ ነው።
notif.ORDER_READY_FOR_PICKUP.title=ትዕዛዝ {0} ለመጫን ዝግጁ ነው
notif.ORDER_READY_FOR_PICKUP.body=ምርቱ ታሽጎ በእርሻው ላይ እየጠበቀ ነው።
notif.DELIVERY_ASSIGNED.title=ለ{0} ሹፌር ተመድቧል
notif.DELIVERY_ASSIGNED.body={1} ይህን ትዕዛዝ ጭኖ ያደርሳል።
notif.DELIVERY_PICKED_UP.title=ትዕዛዝ {0} ተጭኗል
notif.DELIVERY_PICKED_UP.body=ሹፌሩ {1} ኪ.ግ ጭኖ በመንገድ ላይ ነው።
notif.DELIVERY_IN_TRANSIT.title=ትዕዛዝ {0} በመንገድ ላይ ነው
notif.DELIVERY_IN_TRANSIT.body=የርክክብ ኮድዎን ያዘጋጁ።
notif.DELIVERY_DELIVERED.title=ትዕዛዝ {0} ደርሷል
notif.DELIVERY_DELIVERED.body=ዕቃውን ይመልከቱና ከ{1} በፊት ያረጋግጡ። ከዚያ በኋላ ገንዘቡ በራስ-ሰር ይለቀቃል።
notif.ORDER_COMPLETED.title=ትዕዛዝ {0} ተጠናቋል
notif.ORDER_COMPLETED.body=በአግሪሊንክ ስለነገዱ እናመሰግናለን። እባክዎ ልምድዎን ደረጃ ይስጡ።
notif.PAYOUT_RELEASED.title=ለ{0} ገንዘብ ተለቋል
notif.PAYOUT_RELEASED.body=ብር {1} ወደ አግሪሊንክ የኪስ ቦርሳዎ ገብቷል።
notif.DISPUTE_OPENED.title=በ{0} ላይ ችግር ተነግሯል
notif.DISPUTE_OPENED.body=ክርክር {1} ተከፍቷል። ወኪል ገምግሞ ሁለቱንም ወገኖች ይደውላል።
notif.DISPUTE_UPDATED.title=ክርክር {1} ተሻሽሏል
notif.DISPUTE_UPDATED.body=በትዕዛዝ {0} ክርክር ላይ አዲስ መረጃ ተጨምሯል።
notif.DISPUTE_RESOLVED.title=ክርክር {1} ተፈትቷል
notif.DISPUTE_RESOLVED.body=በትዕዛዝ {0} ላይ ውሳኔ ተሰጥቷል። ዝርዝሩን ለማየት ትዕዛዙን ይክፈቱ።
notif.VERIFICATION_APPROVED.title=ተረጋግጠዋል
notif.VERIFICATION_APPROVED.body=የአግሪሊንክ መለያዎ ተረጋግጧል። አሁን ያለገደብ መነገድ ይችላሉ።
notif.VERIFICATION_REJECTED.title=ማረጋገጫ አልተፈቀደም
notif.VERIFICATION_REJECTED.body=ምክንያት: {0}
notif.VERIFICATION_INFO_NEEDED.title=ተጨማሪ መረጃ ያስፈልጋል
notif.VERIFICATION_INFO_NEEDED.body={0}
notif.RATING_RECEIVED.title=አዲስ ደረጃ
notif.RATING_RECEIVED.body=ለትዕዛዝ {1} ከ5 {0} አግኝተዋል።
