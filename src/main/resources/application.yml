spring:
  application:
    name: agrilink-backend
  datasource:
    url: ${AGRILINK_DB_URL:jdbc:postgresql://localhost:5432/agrilink}
    username: ${AGRILINK_DB_USERNAME:postgres}
    password: ${AGRILINK_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

agrilink:
  security:
    jwt:
      # Base64 or plain text, at least 32 bytes. Required: supply AGRILINK_JWT_SECRET in every real environment.
      secret: ${AGRILINK_JWT_SECRET}
      issuer: agrilink
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    cors-allowed-origins: ${AGRILINK_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    max-failed-logins: 5
    lock-duration: 15m
  otp:
    length: 6
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 60s
    max-requests-per-hour: 5
    expose-in-response: false
  pricing:
    platform-fee-percent: 2.0
    delivery-base-fee: 600
    delivery-per-km: 15
    delivery-per-kg: 0.20
    delivery-min-fee: 500
    road-distance-factor: 1.3
    default-distance-km: 100
    rounding-step: 10
  orders:
    farmer-response-window: 2h
    payment-window: 30m
    check-window: 6h
    max-active-deliveries-per-driver: 3
    max-code-attempts: 5
  disputes:
    resolution-target: 24h
  marketplace:
    require-verified-farmers: true
  payment:
    default-provider: mock
    mock:
      auto-confirm: false
      webhook-secret: ${AGRILINK_PAYMENT_WEBHOOK_SECRET:change-me}
  storage:
    local-path: ${AGRILINK_STORAGE_PATH:./data/uploads}
    public-base-path: /api/v1/files
  notifications:
    # Notification types that are also delivered by SMS (farmers on basic phones).
    sms-types:
      - ORDER_CREATED
      - ORDER_ACCEPTED
      - PAYMENT_HELD
      - DELIVERY_ASSIGNED
      - DELIVERY_PICKED_UP
      - DELIVERY_DELIVERED
      - ORDER_COMPLETED
      - PAYOUT_RELEASED
      - DISPUTE_RESOLVED
  scheduling:
    enabled: true
    order-maintenance-interval: 60s
  bootstrap:
    admin-phone: ${AGRILINK_ADMIN_PHONE:}
    admin-password: ${AGRILINK_ADMIN_PASSWORD:}
    admin-name: ${AGRILINK_ADMIN_NAME:AgriLink Admin}
    seed-demo-data: false
